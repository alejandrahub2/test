name: mirror
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true

concurrency:
  group: tikki-upload
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Generic static ffmpeg/ffprobe built by build-ffmpeg.yml in this repo.
  FFMPEG_TAG: ${{ vars.FFMPEG_TAG || 'ffmpeg-n8.1.3-r3' }}

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: fetch tools
        env:
          TOKEN: ${{ secrets.TIKKI_CI_TOKEN }}
          API: ${{ vars.TIKKI_API_URL }}
          REPO: ${{ github.repository }}
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          base="https://github.com/$REPO/releases/download/$FFMPEG_TAG"

          # All four downloads at once; none depends on another.
          curl -fsSL --retry 3 "$base/ffmpeg"     -o "$bin/ffmpeg"  &
          curl -fsSL --retry 3 "$base/ffprobe"    -o "$bin/ffprobe" &
          curl -fsSL --retry 3 "$base/SHA256SUMS" -o "$bin/SHA256SUMS" &
          curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" "$API/v1/ci/worker" -o "$RUNNER_TEMP/worker" &
          fail=0
          for job in $(jobs -p); do wait "$job" || fail=1; done

          chmod +x "$RUNNER_TEMP/worker"
          if [ "$fail" = 0 ] && (cd "$bin" && sha256sum --quiet -c SHA256SUMS) && chmod +x "$bin/ffmpeg" "$bin/ffprobe"; then
            echo "$bin" >> "$GITHUB_PATH"
            echo "ffmpeg: static $FFMPEG_TAG"
          else
            echo "ffmpeg: static build unavailable, falling back to apt"
            if [ ! -s "$RUNNER_TEMP/worker" ]; then
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" "$API/v1/ci/worker" -o "$RUNNER_TEMP/worker"
              chmod +x "$RUNNER_TEMP/worker"
            fi
            rm -f "$bin/ffmpeg" "$bin/ffprobe"
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi

      - name: mirror
        env:
          TIKKI_CI_API: ${{ vars.TIKKI_API_URL }}
          TIKKI_CI_JOB_ID: ${{ inputs.job_id }}
          TIKKI_CI_TOKEN: ${{ secrets.TIKKI_CI_TOKEN }}
        run: |
          curl -s -m 10 https://ipinfo.io/json | python3 -c "import sys,json; d=json.load(sys.stdin); print('ip=' + d.get('ip','?'), 'region=' + d.get('region','?') + '/' + d.get('country','?'), 'org=' + d.get('org','?').replace(' ','_'))" || echo "ip=unknown"
          ffmpeg -version | head -1
          "$RUNNER_TEMP/worker"
